consultant_subject_prior_6_months: 'Déclaration provisoire des activités de lobbyisme'
consultant_prior_6_months:
  value: '<p>Vous devez actualiser vos activités de lobbyisme tous les six mois dans le cadre de votre contrat de lobbyisme. Vous disposez de 30 jours à compter d’aujourd’hui pour le faire.&nbsp;</p><p>&nbsp;</p><p><strong>Ce qu’il faut faire</strong></p><p>Pour produire votre déclaration semestrielle, connectez-vous au<a href="http://bizont-lobbyist.cms-dev.ynet.gov.yk.ca/fr/s-identifier"> registre des lobbyistes du Yukon</a>. Passez en revue vos activités de lobbyisme, actualisez-les au besoin et attestez que les renseignements sont exacts.</p><p>&nbsp;</p><p><strong>Pour en savoir plus</strong></p><p>Pour en savoir plus sur les exigences de déclaration des activités de lobbyisme, consultez la <a href="https://legislation.yukon.ca/acts/lobreg_c.pdf"><em>Loi sur l’inscription des lobbyistes</em></a>.</p>'
  format: basic_html
consultant_subject_prior_6_months_plus_15: 'Déclaration provisoire des activités de lobbyisme'
consultant_prior_6_months_plus_15:
  value: '<p>Vous devez actualiser vos activités de lobbyisme tous les six mois dans le cadre de votre contrat de lobbyisme. Vous disposez de 15 jours à compter d’aujourd’hui pour le faire.&nbsp;</p><p>&nbsp;</p><p><strong>Ce qu’il faut faire</strong></p><p>Pour produire votre déclaration semestrielle, connectez-vous au <a href="http://bizont-lobbyist.cms-dev.ynet.gov.yk.ca/fr/s-identifier">registre des lobbyistes du Yukon</a>. Passez en revue vos activités de lobbyisme, actualisez-les au besoin et attestez que les renseignements sont exacts.</p><p>&nbsp;</p><p><strong>Pour en savoir plus</strong></p><p>Pour en savoir plus sur les exigences de déclaration des activités de lobbyisme, consultez la <a href="https://legislation.yukon.ca/acts/lobreg_c.pdf"><em>Loi sur l’inscription des lobbyistes</em></a>.</p><p>&nbsp;</p><p><strong>Pour obtenir de l’aide</strong></p><p>Contactez l’administrateur à l’adresse <a href="mailto:info@yukonlobbyistregistry.ca">info@yukonlobbyistregistry.ca</a>.</p>'
  format: basic_html
consultant_subject_prior_6_months_plus_30: 'Déclaration provisoire des activités de lobbyisme – omission de déclaration'
consultant_prior_6_months_plus_30:
  value: '<p>Votre organisation n’a pas produit de déclaration semestrielle.&nbsp;Votre déclaration semestrielle accuse maintenant un retard.&nbsp;</p><p>Vous devez actualiser vos activités de lobbyisme tous les six mois dans le cadre de votre contrat de lobbyisme.&nbsp;</p><p>&nbsp;</p><p><strong>Ce qu’il faut faire</strong></p><p>Pour produire votre déclaration semestrielle, connectez-vous au<a href="http://bizont-lobbyist.cms-dev.ynet.gov.yk.ca/fr/s-identifier"> registre des lobbyistes du Yukon</a>. Passez en revue vos activités de lobbyisme, actualisezles au besoin et attestez que les renseignements sont exacts.</p><p>&nbsp;</p><p><strong>Pour en savoir plus</strong></p><p>Pour en savoir plus sur les exigences de déclaration des activités de lobbyisme, consultez la <a href="https://legislation.yukon.ca/acts/lobreg_c.pdf"><em>Loi sur l’inscription des lobbyistes</em></a>.</p>'
  format: basic_html
consultant_subject_end_contract: 'Fin de la période de déclaration des activités de lobbyisme'
consultant_end_contract:
  value: '<p>Ce message a pour but de vous informer que vous devez produire votre déclaration marquant la fin de votre contrat de lobbyisme dans les 30 jours.</p><p><strong>Ce qu’il faut faire</strong></p><p>Connectez-vous au <a href="http://bizont-lobbyist.cms-dev.ynet.gov.yk.ca/fr/s-identifier">registre des lobbyistes du Yukon</a> pour produire la déclaration finale de votre contrat de lobbyisme. Passez en revue vos activités de lobbyisme, actualisez-les au besoin et attestez que les renseignements sont exacts.</p><p>&nbsp;</p><p>Vous êtes en tout temps responsable de veiller à ce que vos déclarations soient remplies et produites dans les délais prescrits par la Loi.</p><p>&nbsp;</p><p><strong>Pour en savoir plus</strong></p><p>Pour en savoir plus sur les exigences de déclaration des activités de lobbyisme, consultez la <a href="https://legislation.yukon.ca/acts/lobreg_c.pdf"><em>Loi sur l’inscription des lobbyistes</em>.</a></p>'
  format: basic_html
consultant_subject_end_contract_plus_15: 'Fin de la période de déclaration des activités de lobbyisme'
consultant_end_contract_plus_15:
  value: '<p>Ce message a pour but de vous informer que vous devez produire votre déclaration marquant la fin de votre contrat de lobbyisme dans les 15 jours.</p><p><strong>Ce qu’il faut faire</strong></p><p>Connectez-vous au r<a href="http://bizont-lobbyist.cms-dev.ynet.gov.yk.ca/fr/s-identifier">egistre des lobbyistes du Yukon</a> pour produire la déclaration finale de votre contrat de lobbyisme. Passez en revue vos activités de lobbyisme, actualisez-les au besoin et attestez que les renseignements sont exacts.</p><p>&nbsp;</p><p>Vous êtes en tout temps responsable de veiller à ce que vos déclarations soient remplies et produites dans les délais prescrits par la Loi.</p><p>&nbsp;</p><p><strong>Pour en savoir plus</strong></p><p>Pour en savoir plus sur les exigences de déclaration des activités de lobbyisme, consultez la <a href="https://legislation.yukon.ca/acts/lobreg_c.pdf"><em>Loi sur l’inscription des lobbyistes</em></a>.</p>'
  format: basic_html
consultant_subject_end_contract_plus_30: 'Fin de la période de déclaration des activités de lobbyisme – omission de déclaration'
consultant_end_contract_plus_30:
  value: '<p>Ce message a pour but de vous informer que votre déclaration marquant la fin de votre contrat de lobbyisme est en retard.</p><p>Ce retard fait en sorte que vous devenez non conforme. Vos activités de lobbyisme sont dorénavant verrouillées pour l’édition.</p><p><strong>Ce qu’il faut faire</strong></p><p>Contactez l’administrateur à l’adresse <a href="mailto:info@yukonlobbyistregistry.ca">info@yukonlobbyistregistry.ca</a> pour qu’il remette votre compte en règle.</p><p>Vous êtes en tout temps responsable de veiller à ce que vos déclarations soient remplies et produites dans les délais prescrits par la Loi.</p><p>&nbsp;</p><p><strong>Pour en savoir plus</strong></p><p>Pour en savoir plus sur les exigences de déclaration des activités de lobbyisme, consultez la <a href="https://legislation.yukon.ca/acts/lobreg_c.pdf"><em>Loi sur l’inscription des lobbyistes</em></a>.</p>'
  format: basic_html
