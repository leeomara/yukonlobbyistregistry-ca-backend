consultant_subject_certify: 'Déclaration provisoire des activités de lobbyisme'
consultant_certify:
  value: '<p>Nous accusons réception de votre déclaration semestrielle et vous en remercions.</p><p><strong>Pour en savoir plus</strong></p><p>Pour obtenir des renseignements généraux ou accéder à votre compte, connectezvous au <a href="http://bizont-lobbyist.cms-dev.ynet.gov.yk.ca/fr/s-identifier">Registre des lobbyistes du Yukon</a>.</p><p>Pour en savoir plus sur les exigences de déclaration des activités de lobbyisme, consultez la <a href="https://legislation.yukon.ca/acts/lobreg_c.pdf"><em>Loi sur l’inscription des lobbyistes</em></a>.</p>'
