lobbyist_subject_new_comment: 'Nouveau commentaire d’un lobbyiste'
lobbyist_new_comment:
  value: '<p>{{organization}}&nbsp;vous a envoyé un message. Connectezvous au <a href="http://bizont-lobbyist.cms-dev.ynet.gov.yk.ca/fr/s-identifier">registre des lobbyistes du Yukon</a> pour lire le commentaire et y répondre.</p><p><a href="{{link}}">Cliquez ici</a> pour vous connecter et vérifier.</p><p><strong>Pour en savoir plus</strong></p><p>Pour en savoir plus sur les exigences de déclaration des activités de lobbyisme, consultez la <a href="https://legislation.yukon.ca/acts/lobreg_c.pdf"><em>Loi sur l’inscription des lobbyistes</em></a>.</p>'
  format: basic_html
admin_subject_new_comment: 'Registre des lobbyistes du Yukon : Inscription terminée'
admin_new_comment:
  value: '<p>Votre première activité de lobbyisme a été approuvée. Cela veut dire que votre inscription est terminée. Nous évaluons et approuvons la première activité seulement pour vérifier votre compte.</p><p><a href="{{link}}">Cliquez ici</a> pour vous connecter et vérifier.</p><p><strong>Prochaine étape :</strong></p><p>Vous pouvez ouvrir une session et modifier vos informations.<br>Allez à la page <a href="https://yukonlobbyistregistry.ca/fr/gestion-de-votre-compte">Gestion de votre compte</a> pour savoir comment ajouter un lobbyiste salarié et d’autres activités de lobbyisme.</p><p>Pour toute question au sujet du registre, écrivez à&nbsp;<a href="mailto:info@yukonlobbyistregistry.ca">info@yukonlobbyistregistry.ca</a>.</p>'
  format: basic_html
commissioner_subject_approve_first_act: 'Registre des lobbyistes du Yukon : Inscription terminée'
commissioner_approve_first_act:
  value: '<p>Votre première activité de lobbyisme a été approuvée. Cela veut dire que votre inscription est terminée. Nous évaluons et approuvons la première activité seulement pour vérifier votre compte.</p><p><a href="{{link}}">Cliquez ici</a> pour vous connecter et vérifier.</p><p><strong>Prochaine étape :</strong></p><p>Vous pouvez ouvrir une session et modifier vos informations.<br>Allez à la page <a href="https://yukonlobbyistregistry.ca/fr/gestion-de-votre-compte">Gestion de votre compte</a> pour savoir comment ajouter un lobbyiste salarié et d’autres activités de lobbyisme.</p><p>Pour toute question au sujet du registre, écrivez à&nbsp;<a href="mailto:info@yukonlobbyistregistry.ca">info@yukonlobbyistregistry.ca</a>.</p>'
  format: basic_html
commissioner_updated_act:
  value: '<p>L''administrateur a mis à jour une activité. Connectez-vous au <a href="http://bizont-lobbyist.cms-dev.ynet.gov.yk.ca/fr/s-identifier">Registre des lobbyistes du Yukon</a> pour voir le commentaire et répondre.</p><p><a href="{{link}}">Cliquez ici</a> pour vous connecter et vérifier.</p><p><strong>Pour en savoir plus</strong></p><p>Pour en savoir plus sur les exigences de déclaration des activités de lobbyisme, consultez la <a href="https://legislation.yukon.ca/acts/lobreg_c.pdf"><em>Loi sur l’inscription des lobbyistes</em></a>.</p>'
  format: basic_html
