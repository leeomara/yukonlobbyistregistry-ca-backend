in_house_subject_add_new_lobbyist: 'Nouvelle activité de lobbyisme'
in_house_add_new_lobbyist:
  value: '<p>{{organization}}&nbsp;a inscrit votre nom à titre de lobbyiste salarié. Ces renseignements ont été publiés dans <a href="http://bizont-lobbyist.cms-dev.ynet.gov.yk.ca/fr">le registre des lobbyistes du Yukon.&nbsp;</a></p><p>&nbsp;</p><p><strong>Pour en savoir plus</strong></p><p>Pour en savoir plus sur les exigences de déclaration des activités de lobbyisme, consultez la <a href="https://legislation.yukon.ca/acts/lobreg_c.pdf"><em>Loi sur l’inscription des lobbyistes</em></a>.</p>'
  format: basic_html
in_house_subject_add_new_activity: 'Nouvelle activité de lobbyisme'
in_house_add_new_activity:
  value: '<p>Vous avez déclaré une nouvelle activité de lobbyisme. Elle a été publiée dans le<a href="http://bizont-lobbyist.cms-dev.ynet.gov.yk.ca/fr/s-identifier"> registre des lobbyistes du Yukon.</a></p><p>&nbsp;</p><p><strong>Pour en savoir plus</strong></p><p>Pour en savoir plus sur les exigences de déclaration des activités de lobbyisme, consultez la <a href="https://legislation.yukon.ca/acts/lobreg_c.pdf"><em>Loi sur l’inscription des lobbyistes</em>.</a></p>'
  format: basic_html
in_house_subject_end_31_dec: 'Fin de la période de déclaration des activités de lobbyisme'
in_house_end_31_dec:
  value: '<p>Ce message a pour but de vous informer que vous devez produire votre déclaration de fin d''année civile avant le 31&nbsp;janvier.</p><p><strong>Ce qu’il faut faire</strong></p><p>Pour produire votre déclaration de fin d’année civile, connectez-vous au <a href="http://bizont-lobbyist.cms-dev.ynet.gov.yk.ca/fr/s-identifier">registre des lobbyistes du Yukon</a>. Passez en revue vos activités de lobbyisme, actualisez-les au besoin et attestez que les renseignements sont exacts.</p><p>&nbsp;</p><p>Vous êtes en tout temps responsable de veiller à ce que vos déclarations soient remplies et produites dans les délais prescrits par la Loi.</p><p>&nbsp;</p><p><strong>Pour en savoir plus</strong></p><p>Pour en savoir plus sur les exigences de déclaration des activités de lobbyisme, consultez la <a href="https://legislation.yukon.ca/acts/lobreg_c.pdf"><em>Loi sur l’inscription des lobbyistes</em></a>.</p>'
  format: basic_html
in_house_subject_end_15_jan: 'Déclaration provisoire des activités de lobbyisme'
in_house_end_15_jan:
  value: '<p>Ce message a pour but de vous informer que vous devez produire votre déclaration de fin d''année civile avant le 31&nbsp;janvier. Vous disposez de 15 jours à compter d’aujourd’hui pour le faire.&nbsp;</p><p>&nbsp;</p><p><strong>Ce qu’il faut faire</strong></p><p>Pour produire votre déclaration semestrielle, connectez-vous au <a href="http://bizont-lobbyist.cms-dev.ynet.gov.yk.ca/fr/s-identifier">registre des lobbyistes du Yukon</a>. Passez en revue vos activités de lobbyisme, actualisez-les au besoin et attestez que les renseignements sont exacts.</p><p>&nbsp;</p><p><strong>Pour en savoir plus</strong></p><p>Pour en savoir plus sur les exigences de déclaration des activités de lobbyisme, consultez la <a href="https://legislation.yukon.ca/acts/lobreg_c.pdf"><em>Loi sur l’inscription des lobbyistes</em></a>.</p><p>&nbsp;</p><p><strong>Pour obtenir de l’aide</strong></p><p>Contactez l’administrateur à l’adresse <a href="mailto:info@yukonlobbyistregistry.ca">info@yukonlobbyistregistry.ca</a>.</p>'
  format: basic_html
in_house_subject_end_31_jan: 'Fin de la période de déclaration des activités de lobbyisme – omission de déclaration'
in_house_end_31_jan:
  value: '<p>Ce message a pour but de vous informer que vous deviez produire votre déclaration de fin d''année civile avant le 31&nbsp;janvier. Vous n’avez pas produit votre déclaration. Votre organisation est donc jugée non conforme et vos activités de lobbyisme sont dorénavant verrouillées pour l’édition.</p><p><strong>Ce qu’il faut faire</strong></p><p>Contactez l’administrateur à l’adresse <a href="mailto:info@yukonlobbyistregistry.ca">info@yukonlobbyistregistry.ca</a> pour qu’il remette votre compte en règle.&nbsp;</p><p>Vous êtes en tout temps responsable de veiller à ce que vos déclarations soient remplies et produites dans les délais prescrits par la Loi.</p><p>&nbsp;</p><p><strong>Pour en savoir plus</strong></p><p>Pour en savoir plus sur les exigences de déclaration des activités de lobbyisme, consultez la <a href="https://legislation.yukon.ca/acts/lobreg_c.pdf"><em>Loi sur l’inscription des lobbyistes</em></a>.</p>'
  format: basic_html
in_house_subject_update_before_end_calendar: 'Fin de la période de déclaration des activités de lobbyisme'
in_house_update_before_end_calendar:
  value: '<p>Nous accusons réception de votre déclaration de fin d’année civile et vous en remercions.</p><p>&nbsp;</p><p><strong>Pour en savoir plus</strong></p><p>Pour obtenir des renseignements généraux ou accéder à votre compte, connectezvous au <a href="http://bizont-lobbyist.cms-dev.ynet.gov.yk.ca/fr/s-identifier">registre des lobbyistes du Yukon</a>.</p><p>Pour en savoir plus sur les exigences de déclaration des activités de lobbyisme, consultez la <a href="https://legislation.yukon.ca/acts/lobreg_c.pdf"><em>Loi sur l’inscription des lobbyistes</em>.</a></p>'
  format: basic_html
in_house_subject_first_activity: 'Registre des lobbyistes du Yukon – Confirmation de votre inscription'
in_house_first_activity:
  value: '<p>Nous avons approuvé votre première activité déclarée de lobbyisme. Votre inscription est donc terminée. Nous n’examinons et n’approuvons votre première activité de lobbyisme que pour vérifier votre compte.</p><p><strong>La suite:</strong></p><ul><li data-list-item-id="eb29b9e12365b72f3c062f0350ccd10c8">&nbsp;<a href="https://yukonlobbyistregistry.ca/fr/gestion-de-votre-compte">Vous pouvez maintenant vous connecter à votre compte et modifier vos renseignements</a>.</li><li data-list-item-id="ecaf3f89159603630f332e0447eba572d">&nbsp;<a href="https://yukonlobbyistregistry.ca/fr/exigences-et-périodes-de-déclaration">Visitez la page sur la gestion de votre compte de lobbyiste pour connaître les directives concernant l’ajout de lobbyistes salariés et d’activités de lobbyisme</a>.&nbsp;</li></ul><p><strong>Pour en savoir plus:</strong></p><p>Si vous avez des questions sur le registre des lobbyistes du Yukon, écrivez à&nbsp;<a href="mailto:info@yukonlobbyistregistry.ca">info@yukonlobbyistregistry.ca</a>&nbsp;ou composez le&nbsp;<a href="tel:8676675618">867-667-5618</a>.</p>'
  format: basic_html
consultant_subject_add_new_activity: 'Nouvelle activité de lobbyisme'
consultant_add_new_activity:
  value: '<p>Vous avez déclaré une nouvelle activité de lobbyisme. Elle a été publiée dans le <a href="http://bizont-lobbyist.cms-dev.ynet.gov.yk.ca/fr/s-identifier">registre des lobbyistes du Yukon.</a></p><p>&nbsp;</p><p><strong>Pour en savoir plus</strong></p><p>Pour en savoir plus sur les exigences de déclaration des activités de lobbyisme, consultez la <a href="https://legislation.yukon.ca/acts/lobreg_c.pdf"><em>Loi sur l’inscription des lobbyistes</em></a>.</p>'
